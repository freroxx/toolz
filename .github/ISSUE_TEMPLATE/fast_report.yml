name: "Fast Report (Crash / Developer Mode)"
description: "Submit a toolz-fast-report-*.md generated from Developer Mode or the crash recovery prompt"
title: "[Fast Report]: "
labels: ["bug", "fast-report"]
body:
  - type: markdown
    attributes:
      value: |
        ### Submitting a Toolz Fast Report
        Toolz can generate a diagnostic `.md` report directly on your device:
        - **After a crash**: Tap **Fast report** on the "Toolz hit a snag" recovery dialog.
        - **In Developer Mode**: Open **Settings → Developer Mode → Fast report**.
        
        The generated file (`toolz-fast-report-*.md`) contains your app version, device model, Android version, recent warnings/errors, and the stack trace.

  - type: textarea
    id: fast-report-content
    attributes:
      label: "Fast Report Markdown Content (.md)"
      description: "Open the generated .md file, copy its full content, and paste it here (or drag and drop the file)."
      placeholder: |
        # Toolz fast report
        > Generated on device at ...
        ## What happened
        ...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: user-context
    attributes:
      label: "What were you doing when this happened?"
      description: "Briefly describe what tool you were using, what you tapped, or what led up to the issue."
      placeholder: "e.g. Switched from Stopwatch to Pomodoro while a timer was running in the background..."
    validations:
      required: true

  - type: textarea
    id: extra-notes
    attributes:
      label: "Additional Context / Screenshots (Optional)"
      description: "Attach any screenshots, screen recordings, or extra details."

  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I confirm this is a report generated by Toolz (or contains accurate logs) and does not expose private passwords, tokens, or personal files."
          required: true
