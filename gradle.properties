# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 1. Optimized Memory and Parallel Garbage Collection for 8GB Systems
# Kept at 2048m but restricted metaspace to prevent silent memory leaks
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. Parallelization and Execution Performance
# Parallel is disabled below because it spawns multiple workers that multiply RAM usage
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

# 3. Android Platform Settings
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# 4. Suppress warnings for compileSdk 36 with current AGP
android.suppressUnsupportedCompileSdk=36

# 5. Jetpack Compose & Kotlin Compiler Optimization
kotlin.incremental=true
# Force the Kotlin daemon to share memory with Gradle instead of spawning a new process
kotlin.daemon.jvmargs=-Xmx1024m