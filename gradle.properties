# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 1. Optimized Memory and Parallel Garbage Collection for 8GB Systems
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. Parallelization and Execution Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 3. Android Platform Settings
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# 4. Suppress warnings for compileSdk 36 with current AGP
android.suppressUnsupportedCompileSdk=36

# 5. Jetpack Compose & Kotlin Compiler Optimization
kotlin.incremental=true
android.enableV2Embedding=true